[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
ember = "ELF3WhvZLbFm9wA2NeWp1e7tn3KCxwWEsXVC3M8oim5y"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false
